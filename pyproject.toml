[project]
name = "camortgage"
version = "0.1.0"
description = "California mortgage rate checker and qualification calculator"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
camortgage = "camortgage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camortgage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
